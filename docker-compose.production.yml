services:
  app-production:
    image: system-health-dashboard:mp2
    container_name: app-production
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      ENVIRONMENT: production
      ENABLE_FAULT_INJECTION: "false"
    restart: unless-stopped
    networks:
      - sre-monitoring

networks:
  sre-monitoring:
    external: true